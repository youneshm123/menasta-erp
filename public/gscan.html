<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>MENASTA — Vente Graissage</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%235b4fcf'/><text y='23' x='5' font-size='20'>⛽</text></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#5b4fcf;--primary-dk:#4a3fb8;--bg:#f4f5f9;--surface:#fff;
  --border:#e5e7eb;--text:#111827;--muted:#6b7280;
  --green:#059669;--green-lt:#ecfdf5;--red:#dc2626;--red-lt:#fef2f2;--orange:#d97706;
  --font:'Inter',system-ui,sans-serif;--r:14px;
}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100vh;padding:18px}
.top{display:flex;align-items:center;gap:9px;width:100%;max-width:440px;margin:6px 0 18px}
.mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--primary),#7c6ee0);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex-shrink:0}
.brand{font-weight:800;font-size:16px;letter-spacing:-.3px}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);box-shadow:0 4px 18px rgba(0,0,0,.06);padding:22px;text-align:center}
.pimg{width:120px;height:120px;border-radius:14px;object-fit:cover;border:1px solid var(--border);margin:0 auto 14px;display:block;background:var(--bg)}
.cat{font-size:12px;font-weight:600;color:var(--primary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.pname{font-size:24px;font-weight:800;letter-spacing:-.4px;line-height:1.2;margin-bottom:14px}
.rows{display:flex;gap:10px;margin-bottom:20px}
.box{flex:1;background:var(--bg);border-radius:10px;padding:12px 8px}
.box-lbl{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px}
.box-val{font-size:20px;font-weight:800;letter-spacing:-.3px}
.box-val small{font-size:12px;font-weight:600;color:var(--muted)}
.stock-ok{color:var(--green)}.stock-low{color:var(--orange)}.stock-out{color:var(--red)}
.btn{width:100%;border:none;border-radius:12px;padding:18px;font-size:18px;font-weight:800;
  font-family:var(--font);cursor:pointer;transition:transform .08s,opacity .15s;display:flex;
  align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn-go{background:var(--primary);color:#fff}
.btn-go:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:var(--surface);color:var(--primary);border:1.5px solid var(--border);font-size:15px;padding:14px;margin-top:10px}
.msg{padding:14px;border-radius:10px;font-size:14px;font-weight:600;margin-bottom:16px}
.msg-er{background:var(--red-lt);color:var(--red)}
.result{text-align:center}
.result .big{font-size:54px;margin-bottom:8px}
.result h2{font-size:22px;font-weight:800;margin-bottom:6px}
.result p{font-size:15px;color:var(--muted);margin-bottom:4px}
.result .rem{font-size:15px;font-weight:700;margin:14px 0 20px}
.spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--primary);
  border-radius:50%;animation:sp 1s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.foot{margin-top:18px;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="top">
  <div class="mark">🛢️</div>
  <div class="brand">MENASTA <small>Vente Graissage</small></div>
</div>

<div id="net-banner" style="display:none;width:100%;max-width:440px;margin:-6px 0 12px;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:700;text-align:center"></div>

<div id="basket-bar" style="display:none;width:100%;max-width:440px;margin:0 0 14px;background:var(--surface);border:1.5px solid var(--primary);border-radius:var(--r);padding:14px 16px;box-shadow:0 4px 18px rgba(0,0,0,.06)"></div>

<div class="card" id="card">
  <div class="spin"></div>
</div>

<div class="foot" id="foot"></div>

<script>
const TOKEN = localStorage.getItem('fm_token');
const USER = (() => { try { return JSON.parse(localStorage.getItem('fm_user') || 'null'); } catch { return null; } })();
const CAN_MANAGE = USER && ['gerant','patron','admin'].includes(USER.role);
const ID = (location.pathname.match(/\/gscan\/(\d+)/) || [])[1];
const card = document.getElementById('card');
const foot = document.getElementById('foot');
const fmt = n => (parseFloat(n)||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});

function gotoLogin() {
  localStorage.removeItem('fm_token');
  localStorage.removeItem('fm_user');
  location.href = '/?return=' + encodeURIComponent(location.pathname);
}

if (!TOKEN) { gotoLogin(); }
if (!ID)    { card.innerHTML = '<div class="msg msg-er">QR invalide — aucun produit.</div>'; }

let product = null;
let offline = false;

const QKEY  = 'gscan_queue';
const BKEY  = 'gscan_basket';
const PKEY  = 'gscan_prod_' + ID;
const genUid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'u-' + Date.now() + '-' + Math.random().toString(16).slice(2));
const getQueue = () => { try { return JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch { return []; } };
const setQueue = q => localStorage.setItem(QKEY, JSON.stringify(q));

function banner() {
  const b = document.getElementById('net-banner');
  const pending = getQueue().length;
  if (offline || pending) {
    b.style.display = 'block';
    if (offline) {
      b.style.background = '#FEF2F2'; b.style.color = '#dc2626';
      b.textContent = '📴 Hors ligne — les ventes sont enregistrées et seront envoyées au retour du réseau'
        + (pending ? ' (' + pending + ' en attente)' : '');
    } else {
      b.style.background = '#FFFBEB'; b.style.color = '#b45309';
      b.textContent = '🔄 Synchronisation… ' + pending + ' vente(s) en attente';
    }
  } else {
    b.style.display = 'none';
  }
}

async function loadProduct() {
  try {
    const r = await fetch('/api/graissage/' + ID, { headers: { Authorization: 'Bearer ' + TOKEN } });
    if (r.status === 401) return gotoLogin();
    const d = await r.json();
    if (!r.ok) { card.innerHTML = '<div class="msg msg-er">' + (d.error || 'Produit introuvable') + '</div>'; return; }
    product = d;
    localStorage.setItem(PKEY, JSON.stringify(d));
    offline = false; banner();
    renderProduct();
    syncQueue();
  } catch (e) {
    const cached = (() => { try { return JSON.parse(localStorage.getItem(PKEY) || 'null'); } catch { return null; } })();
    if (cached) {
      product = cached; offline = true; banner();
      renderProduct();
    } else {
      card.innerHTML = '<div class="msg msg-er">📴 Hors ligne et produit jamais chargé. Connectez-vous une fois pour pouvoir le scanner sans réseau.</div>';
    }
  }
}

let qtySel = 1;

function renderProduct() {
  const held = parseFloat(product.held_qty) || 0;
  const out = held < 1;
  qtySel = 1;
  const stepBtn = 'width:54px;height:54px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface);color:var(--primary);font-size:30px;font-weight:800;cursor:pointer;line-height:1';
  card.innerHTML =
    (product.image_data ? '<img class="pimg" src="' + esc(product.image_data) + '" alt=""/>' : '') +
    '<div class="cat">Graissage</div>' +
    '<div class="pname">' + esc(product.name) + '</div>' +
    '<div class="rows">' +
      '<div class="box"><div class="box-lbl">Prix</div><div class="box-val">' + fmt(product.price) + ' <small>DH</small></div></div>' +
      '<div class="box"><div class="box-lbl">Stock</div><div class="box-val ' + (out?'stock-out':held<=2?'stock-low':'stock-ok') + '">' + held + ' <small>' + esc(product.unit||'') + '</small></div></div>' +
    '</div>' +
    (out
      ? '<div class="msg msg-er">⚠️ Stock épuisé.</div>'
      : '<div style="font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">Quantité vendue</div>' +
        '<div style="display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:18px">' +
          '<button id="qminus" style="' + stepBtn + '">−</button>' +
          '<div id="qval" style="font-size:38px;font-weight:800;min-width:60px">1</div>' +
          '<button id="qplus" style="' + stepBtn + '">+</button>' +
        '</div>' +
        '<button class="btn btn-go" id="sell"></button>' +
        '<button class="btn btn-ghost" id="addcart">🛒 Ajouter au panier</button>');
  foot.textContent = 'Connecté — choisissez la quantité puis confirmez.';
  if (!out) {
    wireStepper(held); updateSellBtn();
    document.getElementById('sell').addEventListener('click', sell);
    document.getElementById('addcart').addEventListener('click', addToBasket);
  }
  renderBasket();
}

// ── Panier multi-articles : scanner plusieurs QR puis encaisser en une fois ──
const getBasket = () => { try { return JSON.parse(localStorage.getItem(BKEY) || '[]'); } catch { return []; } };
const setBasket = b => { localStorage.setItem(BKEY, JSON.stringify(b)); renderBasket(); };

function addToBasket() {
  const held = parseFloat(product.held_qty) || 0;
  const b = getBasket();
  const ex = b.find(it => String(it.product_id) === String(ID));
  const already = ex ? ex.qty : 0;
  if (already + qtySel > held) {
    card.insertAdjacentHTML('afterbegin', '<div class="msg msg-er">Stock insuffisant : ' + held + ' ' + esc(product.unit||'') + ' en stock, déjà ' + already + ' au panier.</div>');
    return;
  }
  if (ex) ex.qty += qtySel;
  else b.push({ product_id: ID, name: product.name, unit: product.unit || 'unité', price: parseFloat(product.price) || 0, qty: qtySel });
  setBasket(b);
  qtySel = 1;
  renderProduct();
}

function removeFromBasket(pid) {
  setBasket(getBasket().filter(it => String(it.product_id) !== String(pid)));
}

function renderBasket() {
  const bar = document.getElementById('basket-bar');
  const b = getBasket();
  if (!b.length) { bar.style.display = 'none'; return; }
  const total = b.reduce((a, it) => a + it.price * it.qty, 0);
  bar.innerHTML =
    '<div style="font-size:13px;font-weight:800;color:var(--primary);margin-bottom:8px">🛒 Panier (' + b.length + ' article' + (b.length>1?'s':'') + ')</div>' +
    b.map(it =>
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:14px">' +
        '<div style="flex:1;text-align:left"><b>' + esc(it.name) + '</b><br/><span style="color:var(--muted);font-size:12px">' + it.qty + ' × ' + fmt(it.price) + ' DH</span></div>' +
        '<div style="font-weight:800">' + fmt(it.price * it.qty) + ' DH</div>' +
        '<button onclick="removeFromBasket(\'' + String(it.product_id) + '\')" style="border:none;background:var(--red-lt);color:var(--red);width:30px;height:30px;border-radius:8px;font-size:15px;font-weight:800;cursor:pointer">✕</button>' +
      '</div>').join('') +
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:16px;font-weight:800"><span>Total</span><span>' + fmt(total) + ' DH</span></div>' +
    '<button class="btn btn-go" id="checkout" style="margin-top:10px;padding:14px;font-size:16px">💰 Encaisser tout · ' + fmt(total) + ' DH</button>' +
    '<button class="btn btn-ghost" id="clearcart" style="padding:10px;font-size:13px">Vider le panier</button>';
  bar.style.display = 'block';
  document.getElementById('checkout').addEventListener('click', checkoutBasket);
  document.getElementById('clearcart').addEventListener('click', () => { if (confirm('Vider le panier ?')) setBasket([]); });
}

async function checkoutBasket() {
  const b = getBasket();
  if (!b.length) return;
  const btn = document.getElementById('checkout');
  btn.disabled = true; btn.textContent = 'Enregistrement…';
  let soldTotal = 0, soldCount = 0, queuedCount = 0;
  const errors = [];
  for (const it of b) {
    const uid = genUid();
    try {
      const r = await fetch('/api/graissage/scan-sell', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN },
        body: JSON.stringify({ product_id: it.product_id, client_uid: uid, qty: it.qty })
      });
      if (r.status === 401) return gotoLogin();
      const d = await r.json();
      if (!r.ok) { errors.push(it.name + ' : ' + (d.error || 'Erreur')); continue; }
      soldTotal += +d.total_amount || it.price * it.qty; soldCount++;
      if (String(it.product_id) === String(ID)) {
        product.held_qty = d.remaining_stock;
        localStorage.setItem(PKEY, JSON.stringify(product));
      }
    } catch (netErr) {
      // Hors ligne : la vente part dans la file et sera synchronisée plus tard.
      const q = getQueue();
      q.push({ uid, product_id: it.product_id, qty: it.qty, ts: Date.now() });
      setQueue(q);
      offline = true;
      soldTotal += it.price * it.qty; queuedCount++;
      if (String(it.product_id) === String(ID)) {
        product.held_qty = (parseFloat(product.held_qty) || 0) - it.qty;
        localStorage.setItem(PKEY, JSON.stringify(product));
      }
    }
  }
  localStorage.setItem(BKEY, '[]');
  banner();
  renderBasket();
  card.innerHTML =
    '<div class="result">' +
      '<div class="big">' + (queuedCount ? '🕓' : '✅') + '</div>' +
      '<h2>' + (soldCount + queuedCount) + ' vente(s) encaissée(s)</h2>' +
      '<p style="font-weight:700;color:var(--text);font-size:20px;margin-top:6px">' + fmt(soldTotal) + ' DH</p>' +
      (queuedCount ? '<div class="msg" style="background:#FFFBEB;color:#b45309">📴 ' + queuedCount + ' vente(s) hors ligne — envoi automatique au retour du réseau.</div>' : '') +
      errors.map(e => '<div class="msg msg-er">' + esc(e) + '</div>').join('') +
      '<button class="btn btn-go" id="again">Nouvelle vente</button>' +
    '</div>';
  document.getElementById('again').addEventListener('click', () => { renderProduct(); });
}

// Quantity stepper: clamp between 1 and the stock available chez l'employé.
function wireStepper(max) {
  const set = v => { qtySel = Math.min(Math.max(1, v), Math.max(1, max)); document.getElementById('qval').textContent = qtySel; updateSellBtn(); };
  document.getElementById('qminus').addEventListener('click', () => set(qtySel - 1));
  document.getElementById('qplus').addEventListener('click',  () => set(qtySel + 1));
}
function updateSellBtn() {
  const b = document.getElementById('sell'); if (!b) return;
  const u = esc(product.unit || 'unité');
  b.textContent = 'Confirmer · ' + qtySel + ' ' + u + ' = ' + fmt(product.price * qtySel) + ' DH';
}

async function sell() {
  const b = document.getElementById('sell');
  b.disabled = true; b.textContent = 'Enregistrement…';
  const uid = genUid();
  const qty = qtySel;
  try {
    const r = await fetch('/api/graissage/scan-sell', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN },
      body: JSON.stringify({ product_id: ID, client_uid: uid, qty })
    });
    if (r.status === 401) return gotoLogin();
    const d = await r.json();
    if (!r.ok) {
      b.disabled = false; updateSellBtn();
      card.insertAdjacentHTML('afterbegin', '<div class="msg msg-er">' + (d.error || 'Erreur') + '</div>');
      return;
    }
    offline = false; banner();
    renderSuccess(d);
  } catch (e) {
    const q = getQueue();
    q.push({ uid, product_id: ID, qty, ts: Date.now() });
    setQueue(q);
    offline = true;
    const remaining = (parseFloat(product.held_qty) || 0) - qty;
    product.held_qty = remaining;
    localStorage.setItem(PKEY, JSON.stringify(product));
    banner();
    renderQueued(remaining, qty);
  }
}

let _syncing = false;
async function syncQueue() {
  if (_syncing) return;
  let q = getQueue();
  if (!q.length) return;
  _syncing = true;
  banner();
  try {
    while (q.length) {
      const item = q[0];
      let r;
      try {
        r = await fetch('/api/graissage/scan-sell', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN },
          body: JSON.stringify({ product_id: item.product_id, client_uid: item.uid, qty: item.qty || 1 })
        });
      } catch (netErr) {
        break;
      }
      if (r.status === 401) { _syncing = false; return gotoLogin(); }
      q.shift();
      setQueue(q);
      q = getQueue();
    }
    offline = false;
  } finally {
    _syncing = false;
    banner();
  }
}

function renderSuccess(d) {
  const low = d.remaining_stock <= 2;
  const q = d.qty || 1;
  card.innerHTML =
    '<div class="result">' +
      '<div class="big">✅</div>' +
      '<h2>Vendu !</h2>' +
      '<p>' + esc(d.product_name) + (q > 1 ? ' · ' + q + ' ' + esc(product.unit||'unité') : '') + '</p>' +
      '<p style="font-weight:700;color:var(--text);font-size:18px;margin-top:6px">' + fmt(d.total_amount) + ' DH</p>' +
      '<div class="rem ' + (low ? 'stock-low' : 'stock-ok') + '">Reste : ' +d.remaining_stock + ' ' + esc(product.unit||'') + (low ? ' ⚠️' : '') + '</div>' +
      (d.remaining_stock > 0
        ? '<button class="btn btn-go" id="again">Nouvelle vente</button>'
        : '<div class="msg msg-er">Stock épuisé.</div>') +
      (CAN_MANAGE ? '<button class="btn btn-ghost" onclick="location.href=\'/graissage\'">Voir le compte graissage</button>' : '') +
    '</div>';
  product.held_qty = d.remaining_stock;
  const a = document.getElementById('again');
  if (a) a.addEventListener('click', () => { renderProduct(); });
}

function renderQueued(remaining, q) {
  q = q || 1;
  const low = remaining <= 2;
  card.innerHTML =
    '<div class="result">' +
      '<div class="big">🕓</div>' +
      '<h2>Vente enregistrée</h2>' +
      '<p>' + esc(product.name) + (q > 1 ? ' · ' + q + ' ' + esc(product.unit||'unité') : '') + '</p>' +
      '<p style="font-weight:700;color:var(--text);font-size:18px;margin-top:6px">' + fmt(product.price * q) + ' DH</p>' +
      '<div class="rem ' + (low ? 'stock-low' : 'stock-ok') + '">Reste : ' +remaining + ' ' + esc(product.unit||'') + (low ? ' ⚠️' : '') + '</div>' +
      '<div class="msg" style="background:#FFFBEB;color:#b45309">📴 Hors ligne — sera envoyée automatiquement au retour du réseau.</div>' +
      (remaining > 0
        ? '<button class="btn btn-go" id="again">Nouvelle vente</button>'
        : '<div class="msg msg-er">Stock épuisé.</div>') +
    '</div>';
  const a = document.getElementById('again');
  if (a) a.addEventListener('click', () => { renderProduct(); });
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

window.addEventListener('online', () => { offline = false; banner(); syncQueue(); });
window.addEventListener('offline', () => { offline = true; banner(); });
setInterval(() => { if (navigator.onLine) syncQueue(); }, 20000);

if (TOKEN && ID) { banner(); renderBasket(); loadProduct(); }
else { banner(); }
</script>
</body>
</html>
